<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - Global Lawfirm</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* CSS DASAR (Sama dengan Halaman Utama) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #C9A84C; --gold-hover: #b3923a;
            --dark-bg: #0d1117; --darker-bg: #0a0d12;
            --text-light: #ffffff; --text-gray: #b0b8c9;
            --font-heading: 'Playfair Display', serif; --font-body: 'Inter', sans-serif;
        }
        body { font-family: var(--font-body); color: var(--text-light); background-color: var(--dark-bg); line-height: 1.6; }

        /* HEADER NAVIGASI (Sederhana untuk kembali ke Beranda) */
        header {
            position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 20px 60px; background-color: rgba(13, 17, 23, 0.95); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; color: var(--text-light); }
        .logo-img { height: 45px; width: auto; }
        .logo-text { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
        nav a { text-decoration: none; color: var(--gold); font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; transition: 0.3s; }
        nav a:hover { color: var(--text-light); }

        /* DESAIN KONTEN ARTIKEL */
        .post-container { max-width: 800px; margin: 150px auto 100px; padding: 0 30px; }
        .post-header { text-align: center; margin-bottom: 40px; }
        .post-title { font-family: var(--font-heading); font-size: clamp(32px, 4vw, 46px); color: var(--gold); margin-bottom: 15px; line-height: 1.3; }
        .post-meta { color: var(--text-gray); font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
        .post-image { width: 100%; height: auto; max-height: 500px; object-fit: cover; border-radius: 8px; margin-bottom: 50px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* TIPOGRAFI ISI ARTIKEL */
        .post-content { color: var(--text-light); font-size: 17px; line-height: 1.9; }
        .post-content h2, .post-content h3 { font-family: var(--font-heading); color: var(--gold); margin-top: 40px; margin-bottom: 20px; }
        .post-content p { margin-bottom: 25px; text-align: justify; }
        .post-content ul, .post-content ol { margin-bottom: 25px; padding-left: 20px; }
        .post-content li { margin-bottom: 10px; }
        .post-content a { color: var(--gold); text-decoration: underline; }

        /* FOOTER */
        .global-footer { background-color: var(--dark-bg); padding: 60px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
        .footer-bottom { color: #555; font-size: 12px; }

        @media (max-width: 768px) {
            header { flex-direction: column; padding: 20px; gap: 15px; }
            .post-container { margin-top: 180px; }
        }
    </style>
    {% seo %}
</head>
<body>

    <header>
        <a href="{{ '/' | relative_url }}" class="logo-container">
            <img src="https://www.image2url.com/r2/default/images/1784215636764-84bd31c1-6e5f-4364-897b-b26c9685d523.png" alt="Global Lawfirm Logo" class="logo-img">
            <div class="logo-text">Global Lawfirm</div>
        </a>
        <nav>
            <a href="{{ '/' | relative_url }}">&larr; Kembali ke Beranda</a>
        </nav>
    </header>

    <article class="post-container">
        <div class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <div class="post-meta">{{ page.date | date: "%d %b %Y" }} • {{ page.category }}</div>
        </div>
        
        {% if page.image %}
        <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="post-image">
        {% endif %}
        
        <div class="post-content">
            {{ content }}
        </div>
    </article>

    <footer class="global-footer">
        <div class="footer-bottom">
            &copy; 2026 Global Lawfirm. All Rights Reserved.
        </div>
    </footer>

</body>
</html>
